<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080"><defs><pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#dce2e3" stroke-width=".7"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="context-stroke"/></marker></defs><rect width="1440" height="1080" fill="#f6f4ee"/><style>text{font-family:Arial,'PingFang SC',sans-serif;fill:#263238}.title{font-size:30px;font-weight:700}.sub{font-size:16px}.label{font-size:17px;font-weight:700}.note{font-size:15px}.small{font-size:13px}</style><text x="40" y="50" class="title">矿洞三层｜潜入兽矿 · 救出小兽</text><text x="40" y="82" class="sub">修订方案 V1 · 正交平面搭建图 · 单位 m · 网格 2×2 m · 所有尺寸为净空 · 参数为待实机验证的设计假设</text><rect x="60" y="130" width="800" height="500" fill="url(#grid)" stroke="#aeb9bc"/><rect x="80" y="150" width="120" height="100" fill="#e4daf2" stroke="#63747b" stroke-width="2"/><rect x="200" y="190" width="60" height="40" fill="#e5eadd" stroke="#63747b" stroke-width="2"/><rect x="260" y="150" width="60" height="80" fill="#e5eadd" stroke="#63747b" stroke-width="2"/><rect x="260" y="230" width="40" height="180" fill="#e5eadd" stroke="#63747b" stroke-width="2"/><rect x="140" y="370" width="160" height="40" fill="#e5eadd" stroke="#63747b" stroke-width="2"/><rect x="140" y="410" width="40" height="100" fill="#e5eadd" stroke="#63747b" stroke-width="2"/><rect x="140" y="510" width="260" height="40" fill="#e5eadd" stroke="#63747b" stroke-width="2"/><rect x="400" y="430" width="160" height="160" fill="#e4daf2" stroke="#63747b" stroke-width="2"/><rect x="560" y="490" width="140" height="40" fill="#dceaf4" stroke="#63747b" stroke-width="2"/><rect x="700" y="470" width="120" height="100" fill="#dceaf4" stroke="#63747b" stroke-width="2"/><rect x="360" y="150" width="260" height="200" fill="#f3e2cd" stroke="#63747b" stroke-width="2"/><rect x="300" y="270" width="60" height="40" fill="#e5eadd" stroke="#63747b" stroke-width="2"/><rect x="430" y="450" width="60" height="60" fill="#c9bacf" stroke="#63747b" stroke-width="2"/><rect x="620" y="490" width="40" height="40" fill="#a1a6aa" stroke="#63747b" stroke-width="2"/><rect x="140" y="450" width="40" height="40" fill="#b8c6a6" stroke="#63747b" stroke-width="2"/><rect x="340" y="270" width="20" height="40" fill="#d29465" stroke="#63747b" stroke-width="2"/><text x="90" y="180" class="small">① 入口 12×10</text><text x="260" y="170" class="small">② 观察台</text><text x="365.0" y="180" class="small">④ 采矿区 26×20</text><text x="405.0" y="570" class="small">⑤ 救援区 16×16</text><text x="705.0" y="550" class="small">⑥ 出口 12×10</text><text x="150" y="372" class="small">③ 旧脉通道 · 净宽4</text><text x="150" y="480" class="small">竖井</text><text x="430" y="480" class="small">囚笼</text><text x="570" y="480" class="small">塌方 4×4</text><polyline points="140,200 230,210 280,210 280,390 160,390 160,530 410,530 460,520" fill="none" stroke="#8060a0" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow)"/><polyline points="480,530 540,510 600,510 680,510 760,510 820,510" fill="none" stroke="#3679ad" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow)"/><polyline points="300,290 400,290 460,250" fill="none" stroke="#b87935" stroke-width="3" stroke-dasharray="8 5" marker-end="url(#arrow)"/><polyline points="290,200 400,200" fill="none" stroke="#d77b39" stroke-width="3" stroke-dasharray="3 4" marker-end="url(#arrow)"/><text x="66" y="654" class="small">0</text><text x="160" y="654" class="small">10 m</text><path d="M70 638H170M70 633V643M120 633V643M170 633V643" stroke="#263238" stroke-width="2"/><text x="715" y="654" class="small">N ↑（图上为北）</text><text x="900" y="150" class="label">搭建与路线约束</text><text x="900" y="184" class="note">全层可行走地面 Z=0；墙顶 Z=3。</text><text x="900" y="212" class="note">入口上方二层 Z=+4，单向坠落至①。</text><text x="900" y="240" class="note">①落点设软着陆；本层不依赖坠落伤害。</text><text x="900" y="268" class="note">竖井通往二层 +4 / 四层 −4。</text><text x="900" y="296" class="note">井口 4×4；梯子两端各留 2×2 平台。</text><text x="900" y="324" class="note">紫线：主流程；蓝线：解锁后出口。</text><text x="900" y="352" class="note">棕线：救矿工支线，经门 G1 实际进入④。</text><text x="900" y="380" class="note">橙线：观察视线，不代表可通行路线。</text><text x="900" y="408" class="note">②与④之间 4m 裂隙；禁止跳跃通过。</text><text x="900" y="436" class="note">观察窗宽4m，窗台高0.8m。</text><text x="900" y="464" class="note">技能只作用于同侧、无遮挡目标。</text><text x="900" y="492" class="note">图中连通矩形交界全部开口。</text><text x="900" y="520" class="note">其余边界为实体墙或不可跨越护栏。</text><text x="900" y="590" class="label">关键尺寸</text><text x="900" y="623" class="note">②净尺寸 6×8；主通道净宽4。</text><text x="900" y="650" class="note">G1 门宽4；G2 囚笼门宽2。</text><text x="900" y="677" class="note">⑥后续接口宽4，平接下一段。</text><text x="900" y="704" class="note">矿车/装饰不得侵占上述净宽。</text><text x="40" y="715" class="label">流程与门控（完整规则见配套设计文档）</text><text x="40" y="751" class="note">①坠落并激活检查点 → ②观察矿区、听见求救 → ③绕行探索 → ⑤定位并救出小兽 → ⑥稳固塌方后离开</text><text x="40" y="783" class="note">G1：旧脉支路铁链门，用离火斩打开；进入④后，用青木生息救出被梁木压住的矿工（可选支线）。</text><text x="40" y="815" class="note">G2：先用传音定位并安抚，再用离火斩拆除笼门锁链；两条件都满足，小兽加入队伍。</text><text x="40" y="847" class="note">G3：小兽入队后，在塌方前使用厚土镇脉，2秒完成稳固；碎石沿地面收拢，形成4m宽平路。</text><text x="40" y="879" class="note">竖井始终开放：可回二层，也可探至四层接口；返回三层保留已完成机制，不会锁死主流程。</text><text x="40" y="945" class="sub">验证状态：尺寸与状态逻辑已定义；视线、镜头、碰撞、节奏和战斗需在灰盒中实测。</text><text x="40" y="980" class="sub">建议主线 5–7 分钟；矿工支线 +1–2 分钟。此版本不强制战斗；④矿工为中立 NPC。</text><text x="40" y="1015" class="sub">注意：此图为正交搭建依据。轴测展示稿应从同一灰盒导出，避免手绘透视造成尺度偏差。</text></svg>