488L1315 488" fill="none" stroke="#4c7c68" stroke-width="4"/><text x="860" y="610" class="body" text-anchor="middle">档案室 → 维修钥匙</text><rect x="70" y="885" width="2260" height="360" fill="#e9eeef" stroke="#bccbd0" stroke-width="2"/><text x="90" y="930" class="heading" text-anchor="start">L3 · 救援采矿层 · Z=+0m</text><rect x="95" y="1005" width="310" height="105" fill="#ffffff" stroke="#768b96" stroke-width="2"/><text x="250" y="1065" class="body" text-anchor="middle">西楼梯间 8×10m</text><rect x="705" y="1005" width="310" height="105" fill="#ffffff" stroke="#768b96" stroke-width="2"/><text x="860" y="1065" class="body" text-anchor="middle">中庭回廊</text><rect x="1315" y="1005" width="310" height="105" fill="#ffffff" stroke="#768b96" stroke-width="2"/><text x="1470" y="1065" class="body" text-anchor="middle">东楼梯间 8×12m</text><rect x="1885" y="1005" width="310" height="105" fill="#ffffff" stroke="#768b96" stroke-width="2" stroke-dasharray="8 5"/><text x="2040" y="1065" class="body" text-anchor="middle">封闭检修盖</text><path d="M405 1058L705 1058" fill="none" stroke="#4c7c68" stroke-width="4"/><path d="M1015 1058L1315 1058" fill="none" stroke="#4c7c68" stroke-width="4"/><text x="860" y="1180" class="body" text-anchor="middle">矿区 → 保险丝；囚笼救援 → 厚土能力</text><rect x="70" y="1455" width="2260" height="360" fill="#e9eeef" stroke="#bccbd0" stroke-width="2"/><text x="90" y="1500" class="heading" text-anchor="start">L4 · 动力设施层 · Z=-4m</text><rect x="95" y="1575" width="310" height="105" fill="#ffffff" stroke="#768b96" stroke-width="2"/><text x="250" y="1635" class="body" text-anchor="middle">西楼梯间 8×10m</text><rect x="705" y="1575" width="310" height="105" fill="#ffffff" stroke="#768b96" stroke-width="2"/><text x="860" y="1635" class="body" text-anchor="middle">中庭大厅 24×12m</text><rect x="1315" y="1575" width="310" height="105" fill="#ffffff" stroke="#768b96" stroke-width="2"/><text x="1470" y="1635" class="body" text-anchor="middle">东楼梯间 8×12m</text><rect x="1885" y="1575" width="310" height="105" fill="#ffffff" stroke="#768b96" stroke-width="2" stroke-dasharray="8 5"/><text x="2040" y="1635" class="body" text-anchor="middle">封闭检修盖</text><path d="M405 1628L705 1628" fill="none" stroke="#4c7c68" stroke-width="4"/><path d="M1015 1628L1315 1628" fill="none" stroke="#4c7c68" stroke-width="4"/><text x="860" y="1750" class="body" text-anchor="middle">电力控制室 → 安装保险丝 → 全区供电</text><path d="M250 540L250 1005" fill="none" stroke="#b57927" stroke-width="6"/><text x="250" y="757.5" class="heading" text-anchor="middle">↕</text><text x="295" y="792.5" class="body" text-anchor="start">维修钥匙</text><path d="M250 1110L250 1575" fill="none" stroke="#b57927" stroke-width="6"/><text x="250" y="1327.5" class="heading" text-anchor="middle">↕</text><text x="295" y="1362.5" class="body" text-anchor="start">保险丝</text><path d="M1470 540L1470 1005" fill="none" stroke="#537ca5" stroke-width="6"/><text x="1470" y="757.5" class="heading" text-anchor="middle">↕</text><text x="1510" y="792.5" class="body" text-anchor="start">供电后开放</text><path d="M2040 540L2040 1005" fill="none" stroke="#9d648a" stroke-width="4" stroke-dasharray="12 9"/><text x="2080" y="772.5" class="small" text-anchor="start">预留接口</text><path d="M860 540L860 1005" fill="none" stroke="#94a7ad" stroke-width="3" stroke-dasharray="5 8"/><text x="885" y="772.5" class="small" text-anchor="start">挑空视觉联系</text><path d="M1470 1110L1470 1575" fill="none" stroke="#537ca5" stroke-width="6"/><text x="1470" y="1327.5" class="heading" text-anchor="middle">↕</text><text x="1510" y="1362.5" class="body" text-anchor="start">供电后开放</text><path d="M2040 1110L2040 1575" fill="none" stroke="#9d648a" stroke-width="4" stroke-dasharray="12 9"/><text x="2080" y="1342.5" class="small" text-anchor="start">预留接口</text><path d="M860 1110L860 1575" fill="none" stroke="#94a7ad" stroke-width="3" stroke-dasharray="5 8"/><text x="885" y="1342.5" class="small" text-anchor="start">挑空视觉联系</text><text x="70" y="1960" class="heading" text-anchor="start">路线顺序</text><text x="90" y="2010" class="body" text-anchor="start">① L2探索管理区 → 档案室取维修钥匙 → 西楼梯下降至L3。</text><text x="90" y="2058" class="body" text-anchor="start">② L3矿区取保险丝 → 西楼梯继续下降至L4。</text><text x="90" y="2106" class="body" text-anchor="start">③ L4电力控制室安装保险丝 → 东楼梯与供电锁房开放。</text><text x="90" y="2154" class="body" text-anchor="start">④ 经东楼梯返回L3 → 囚笼安抚＋拆链救小兽 → 厚土稳固塌方 → 离开。</text><text x="70" y="2240" class="heading" text-anchor="start">接口说明</text><text x="90" y="2280" class="small" text-anchor="start">W固定范围(14,28,8,10)，E固定范围(58,22,8,12)；每层差4m，24级台阶，踏步深0.3m，梯段宽2m。</text><text x="90" y="2313" class="small" text-anchor="start">H位于西侧维护空间，当前检修盖关闭，未形成可游玩路线；中庭是挑空，不允许当作上下楼通路。</text><text x="90" y="2346" class="small" text-anchor="start">原入口上方的坠落接口未在三层白模启用；房间设备、门禁与流程均为静态设计标注。</text></svg>